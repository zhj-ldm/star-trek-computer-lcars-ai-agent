<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Trek Computer - Setup</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ui-layer { position: fixed; inset: 0; pointer-events: none; }
  #ui-layer > * { pointer-events: auto; }

  /* Left side buttons (transparent overlay; canvas renders the graphics) */
  .side-btn {
    position: absolute; left: 2.5%; width: 12.5%; height: 10.4%;
    background: transparent; border: none; cursor: pointer;
  }
  .side-btn:hover { filter: brightness(1.2); }
  #btn-setup { top: 0; height: 14.6%; }

  /* ============== UPPER / LOWER CONTAINERS ============== */
  /* Panels appear directly inside the canvas black areas — no border,
     no rounded corners, no separate background. The canvas already
     paints these regions black. */
  .panel-box {
    position: absolute;
    box-sizing: border-box; padding: 4px 12px;
    background: transparent; border: none; border-radius: 0;
    overflow-y: auto; display: none;
  }
  /* Upper container: MODEL SETUP — upper-RIGHT black area (y=0~115).
     Kept well above the separator bar at y=115 so it doesn't touch it. */
  #panel-top { left: 40.6%; top: 2%; width: 54.6%; height: 19%; }
  /* Audio / Memory container — moved to UPPER-LEFT black area (y=0~115).
     Left of the model panel, right of the SETUP/elbow column. */
  #panel-bottom { left: 12.5%; top: 2%; width: 27%; height: 19%; }

  .panel-title { color: #FF9900; font-size: 13px; font-weight: bold;
                 margin: 0 0 3px; letter-spacing: 1px; line-height: 1; }
  .module-title { color: #CC99CC; font-size: 13px; font-weight: bold; margin: 0 0 4px; letter-spacing: 1px; }
  .field { margin-bottom: 2px; }
  .field label { display: block; color: #FFCC66; font-size: 10px; margin: 0;
                 letter-spacing: 0.5px; line-height: 1; }
  .field input {
    width: 100%; box-sizing: border-box; background: #111; color: #fff;
    border: 1px solid #FF9900; border-radius: 3px; padding: 1px 6px; font-size: 12px;
    height: 20px; line-height: 18px;
  }
  .field input:focus { outline: none; border-color: #FFCC66; }
  .hint { color: #888; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="ui-layer">
  <!-- Top SETUP button (graphics rendered by canvas) -->
  <button class="side-btn" id="btn-setup"></button>
  <!-- Left side: CHAT / AUDIO / MEMORY buttons -->
  <button class="side-btn" id="btn-chat" style="top:43.75%;"></button>
  <button class="side-btn" id="btn-audio" style="top:55.2%;"></button>
  <button class="side-btn" id="btn-memory" style="top:66.7%;"></button>

  <!-- UPPER CONTAINER: Model settings (shown/hidden by SETUP toggle) -->
  <div id="panel-top" class="panel-box">
    <div class="panel-title">MODEL SETUP</div>
    <div id="panel-top-body"></div>
  </div>
  <!-- LOWER CONTAINER: Audio / Memory modules (shown/hidden by AUDIO/MEMORY buttons) -->
  <div id="panel-bottom" class="panel-box">
    <div id="panel-bottom-body"></div>
  </div>
</div>

<script type="text/plain" id="renderer-engine">


(function (global) {
  'use strict';

  function num(v, d) { return v != null ? v : d; }

  function roundedRectPath(ctx, x, y, w, h, radii) {
    var r = typeof radii === 'number'
      ? { tl: radii, tr: radii, br: radii, bl: radii }
      : { tl: 0, tr: 0, br: 0, bl: 0 };
    if (radii && typeof radii === 'object') {
      if (radii.tl != null) r.tl = radii.tl;
      if (radii.tr != null) r.tr = radii.tr;
      if (radii.br != null) r.br = radii.br;
      if (radii.bl != null) r.bl = radii.bl;
    }
    ctx.beginPath();
    ctx.moveTo(x + r.tl, y);
    ctx.lineTo(x + w - r.tr, y);
    if (r.tr) ctx.arcTo(x + w, y, x + w, y + r.tr, r.tr);
    else ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + h - r.br);
    if (r.br) ctx.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
    else ctx.lineTo(x + w, y + h);
    ctx.lineTo(x + r.bl, y + h);
    if (r.bl) ctx.arcTo(x, y + h, x, y + h - r.bl, r.bl);
    else ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + r.tl);
    if (r.tl) ctx.arcTo(x, y, x + r.tl, y, r.tl);
    else ctx.lineTo(x, y);
    ctx.closePath();
  }

  function drawElbow(ctx, x, y, w, h, color, corner, barW, barH, outerR, innerR) {
    ctx.fillStyle = color;
    var oR = outerR != null ? Math.max(0, Math.min(outerR, w, h)) : Math.min(barH, barW, w, h);
    var iR = innerR != null ? Math.max(0, Math.min(innerR, w - barW, h - barH)) : 0;
    var ov = 0.5;
    ctx.beginPath();
    switch (corner) {
      case 'tl':
        ctx.moveTo(x, y + h + ov);
        ctx.lineTo(x, y + oR);
        ctx.arcTo(x, y, x + oR, y, oR);
        ctx.lineTo(x + w + ov, y);
        ctx.lineTo(x + w + ov, y + barH);
        if (iR > 0) {
          ctx.lineTo(x + barW + iR, y + barH);
          ctx.arcTo(x + barW, y + barH, x + barW, y + barH + iR, iR);
        } else {
          ctx.lineTo(x + barW, y + barH);
        }
        ctx.lineTo(x + barW, y + h + ov);
        break;
      case 'tr':
        ctx.moveTo(x - ov, y);
        ctx.lineTo(x + w - oR, y);
        ctx.arcTo(x + w, y, x + w, y + oR, oR);
        ctx.lineTo(x + w, y + h + ov);
        ctx.lineTo(x + w - barW, y + h + ov);
        if (iR > 0) {
          ctx.lineTo(x + w - barW, y + barH + iR);
          ctx.arcTo(x + w - barW, y + barH, x + w - barW - iR, y + barH, iR);
        } else {
          ctx.lineTo(x + w - barW, y + barH);
        }
        ctx.lineTo(x - ov, y + barH);
        break;
      case 'bl':
        ctx.moveTo(x, y - ov);
        ctx.lineTo(x + barW, y - ov);
        if (iR > 0) {
          ctx.lineTo(x + barW, y + h - barH - iR);
          ctx.arcTo(x + barW, y + h - barH, x + barW + iR, y + h - barH, iR);
        } else {
          ctx.lineTo(x + barW, y + h - barH);
        }
        ctx.lineTo(x + w + ov, y + h - barH);
        ctx.lineTo(x + w + ov, y + h);
        ctx.lineTo(x + oR, y + h);
        ctx.arcTo(x, y + h, x, y + h - oR, oR);
        break;
      case 'br':
        ctx.moveTo(x + w, y - ov);
        ctx.lineTo(x + w, y + h - oR);
        ctx.arcTo(x + w, y + h, x + w - oR, y + h, oR);
        ctx.lineTo(x - ov, y + h);
        ctx.lineTo(x - ov, y + h - barH);
        if (iR > 0) {
          ctx.lineTo(x + w - barW - iR, y + h - barH);
          ctx.arcTo(x + w - barW, y + h - barH, x + w - barW, y + h - barH - iR, iR);
        } else {
          ctx.lineTo(x + w - barW, y + h - barH);
        }
        ctx.lineTo(x + w - barW, y - ov);
        break;
    }
    ctx.closePath();
    ctx.fill();
  }

  function hexToRgb(hex) {
    return {
      r: parseInt(hex.slice(1, 3), 16),
      g: parseInt(hex.slice(3, 5), 16),
      b: parseInt(hex.slice(5, 7), 16)
    };
  }

  function rgbToHex(r, g, b) {
    var to2 = function (v) { return v.toString(16).padStart(2, '0'); };
    return '#' + to2(r) + to2(g) + to2(b);
  }

  /* ---------------- Element renderers ---------------- */
  var ELEMENT_RENDERERS = {};

  ELEMENT_RENDERERS['elbow-tl'] = function (ctx, p) {
    var gap = p.bottomGap || 0;
    drawElbow(ctx, p.x, p.y, p.w, p.h - gap, p.color, 'tl', p.barW, p.barH, p.outerR, p.innerR);
    if (p.label) {
      ctx.fillStyle = p.labelColor;
      ctx.font = 'bold ' + p.labelFontSize + 'px Antonio, Arial, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x + p.w - 6, p.y + p.barH / 2 + 1);
    }
  };

  ELEMENT_RENDERERS['elbow-tr'] = function (ctx, p) {
    var gap = p.bottomGap || 0;
    drawElbow(ctx, p.x, p.y, p.w, p.h - gap, p.color, 'tr', p.barW, p.barH, p.outerR, p.innerR);
    if (p.label) {
      ctx.fillStyle = p.labelColor;
      ctx.font = 'bold ' + p.labelFontSize + 'px Antonio, Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x + 6, p.y + p.barH / 2 + 1);
    }
  };

  ELEMENT_RENDERERS['elbow-bl'] = function (ctx, p) {
    var gap = p.topGap || 0;
    drawElbow(ctx, p.x, p.y + gap, p.w, p.h - gap, p.color, 'bl', p.barW, p.barH, p.outerR, p.innerR);
    if (p.label) {
      ctx.fillStyle = p.labelColor;
      ctx.font = 'bold ' + p.labelFontSize + 'px Antonio, Arial, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x + p.w - 6, p.y + p.h - p.barH / 2 + 1);
    }
  };

  ELEMENT_RENDERERS['elbow-br'] = function (ctx, p) {
    var gap = p.topGap || 0;
    drawElbow(ctx, p.x, p.y + gap, p.w, p.h - gap, p.color, 'br', p.barW, p.barH, p.outerR, p.innerR);
    if (p.label) {
      ctx.fillStyle = p.labelColor;
      ctx.font = 'bold ' + p.labelFontSize + 'px Antonio, Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x + 6, p.y + p.h - p.barH / 2 + 1);
    }
  };

  ELEMENT_RENDERERS['bar-horizontal'] = function (ctx, p) {
    var t = p.topGap || 0, b = p.bottomGap || 0, l = p.leftGap || 0, r = p.rightGap || 0;
    var bx = p.x + l, by = p.y + t;
    var bw = p.w - l - r, bh = p.h - t - b;
    if (bw <= 0 || bh <= 0) return;
    ctx.fillStyle = p.color;
    var hr = bh / 2;
    var rl = p.endCapLeft === 'round' ? hr : 0;
    var rr = p.endCapRight === 'round' ? hr : 0;
    var ovL = rl === 0 ? 0.5 : 0;
    var ovR = rr === 0 ? 0.5 : 0;
    roundedRectPath(ctx, bx - ovL, by, bw + ovL + ovR, bh, { tl: rl, bl: rl, tr: rr, br: rr });
    ctx.fill();
  };

  ELEMENT_RENDERERS['bar-vertical'] = function (ctx, p) {
    var t = p.topGap || 0, b = p.bottomGap || 0, l = p.leftGap || 0, r = p.rightGap || 0;
    var bx = p.x + l, by = p.y + t;
    var bw = p.w - l - r, bh = p.h - t - b;
    if (bw <= 0 || bh <= 0) return;
    ctx.fillStyle = p.color;
    var hr = bw / 2;
    var rt = p.endCapTop === 'round' ? hr : 0;
    var rb = p.endCapBottom === 'round' ? hr : 0;
    var ovT = rt === 0 ? 0.5 : 0;
    var ovB = rb === 0 ? 0.5 : 0;
    roundedRectPath(ctx, bx, by - ovT, bw, bh + ovT + ovB, { tl: rt, tr: rt, bl: rb, br: rb });
    ctx.fill();
  };

  ELEMENT_RENDERERS['separator'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.w, p.h);
  };

  ELEMENT_RENDERERS['button-pill'] = function (ctx, p) {
    var r = p.h / 2;
    ctx.fillStyle = p.color;
    roundedRectPath(ctx, p.x, p.y, p.w, p.h, r);
    ctx.fill();
    ctx.fillStyle = p.textColor;
    ctx.font = 'bold ' + p.fontSize + 'px Antonio, Arial, sans-serif';
    var tx;
    if (p.textAlign === 'left') { ctx.textAlign = 'left'; tx = p.x + r; }
    else if (p.textAlign === 'center') { ctx.textAlign = 'center'; tx = p.x + p.w / 2; }
    else { ctx.textAlign = 'right'; tx = p.x + p.w - r; }
    ctx.textBaseline = 'middle';
    ctx.fillText(p.label, tx, p.y + p.h / 2 + 1);
  };

  ELEMENT_RENDERERS['button-rect'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    roundedRectPath(ctx, p.x, p.y, p.w, p.h, p.radius);
    ctx.fill();
    ctx.fillStyle = p.textColor;
    ctx.font = 'bold ' + p.fontSize + 'px Antonio, Arial, sans-serif';
    var tx;
    if (p.textAlign === 'left') { ctx.textAlign = 'left'; tx = p.x + 8; }
    else if (p.textAlign === 'center') { ctx.textAlign = 'center'; tx = p.x + p.w / 2; }
    else { ctx.textAlign = 'right'; tx = p.x + p.w - 8; }
    ctx.textBaseline = 'middle';
    ctx.fillText(p.label, tx, p.y + p.h / 2 + 1);
  };

  ELEMENT_RENDERERS['button-strip'] = function (ctx, p) {
    var colors = p.colors || [];
    var n = colors.length;
    if (n === 0) return;
    var totalGap = p.gap * (n - 1);
    var segW = (p.w - totalGap) / n;
    var r = p.h / 2;
    for (var i = 0; i < n; i++) {
      ctx.fillStyle = colors[i];
      var sx = p.x + i * (segW + p.gap);
      var rl = (i === 0 && p.capLeft === 'round') ? r : 0;
      var rr = (i === n - 1 && p.capRight === 'round') ? r : 0;
      roundedRectPath(ctx, sx, p.y, segW, p.h, { tl: rl, bl: rl, tr: rr, br: rr });
      ctx.fill();
    }
  };

  ELEMENT_RENDERERS['text-label'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    ctx.font = num(p.fontWeight, 'bold') + ' ' + p.fontSize + 'px Antonio, Arial, sans-serif';
    ctx.textBaseline = 'top';
    if (p.textAlign === 'center') { ctx.textAlign = 'center'; ctx.fillText(p.text, p.x + p.w / 2, p.y); }
    else if (p.textAlign === 'right') { ctx.textAlign = 'right'; ctx.fillText(p.text, p.x + p.w, p.y); }
    else { ctx.textAlign = 'left'; ctx.fillText(p.text, p.x, p.y); }
  };

  ELEMENT_RENDERERS['data-readout'] = function (ctx, p) {
    if (p.bgColor) { ctx.fillStyle = p.bgColor; roundedRectPath(ctx, p.x, p.y, p.w, p.h, 4); ctx.fill(); }
    if (p.borderColor) { ctx.strokeStyle = p.borderColor; ctx.lineWidth = 1; roundedRectPath(ctx, p.x, p.y, p.w, p.h, 4); ctx.stroke(); }
    ctx.fillStyle = p.labelColor;
    ctx.font = 'bold ' + p.labelFontSize + 'px Antonio, Arial, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(p.label, p.x + 6, p.y + 4);
    ctx.fillStyle = p.valueColor;
    ctx.font = 'bold ' + p.valueFontSize + 'px Antonio, Arial, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(p.value, p.x + 6, p.y + p.h - 3);
  };

  ELEMENT_RENDERERS['clock-display'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    ctx.font = 'bold ' + p.fontSize + 'px Antonio, Arial, sans-serif';
    ctx.textBaseline = 'middle';
    if (p.textAlign === 'center') { ctx.textAlign = 'center'; ctx.fillText(p.timeText, p.x + p.w / 2, p.y + p.h / 2); }
    else if (p.textAlign === 'right') { ctx.textAlign = 'right'; ctx.fillText(p.timeText, p.x + p.w, p.y + p.h / 2); }
    else { ctx.textAlign = 'left'; ctx.fillText(p.timeText, p.x, p.y + p.h / 2); }
  };

  ELEMENT_RENDERERS['date-display'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    ctx.font = 'bold ' + p.fontSize + 'px Antonio, Arial, sans-serif';
    ctx.textBaseline = 'middle';
    if (p.textAlign === 'center') { ctx.textAlign = 'center'; ctx.fillText(p.dateText, p.x + p.w / 2, p.y + p.h / 2); }
    else if (p.textAlign === 'right') { ctx.textAlign = 'right'; ctx.fillText(p.dateText, p.x + p.w, p.y + p.h / 2); }
    else { ctx.textAlign = 'left'; ctx.fillText(p.dateText, p.x, p.y + p.h / 2); }
  };

  ELEMENT_RENDERERS['fft-area'] = function (ctx, p) {
    ctx.fillStyle = p.bgColor;
    roundedRectPath(ctx, p.x, p.y, p.w, p.h, p.borderRadius);
    ctx.fill();
    if (p.showBorder) {
      ctx.strokeStyle = p.borderColor;
      ctx.lineWidth = 1;
      roundedRectPath(ctx, p.x, p.y, p.w, p.h, p.borderRadius);
      ctx.stroke();
    }
    var barCount = num(p.barCount, 16);
    if (barCount < 2) barCount = 2;
    ctx.save();
    ctx.beginPath();
    roundedRectPath(ctx, p.x + 1, p.y + 1, p.w - 2, p.h - 2, Math.max(0, (p.borderRadius || 0) - 1));
    ctx.clip();
    var pad = 4;
    var innerW = p.w - pad * 2;
    var innerH = p.h - pad * 2;
    var gap = p.gap || 0;
    var barW = (innerW - (barCount - 1) * gap) / barCount;
    var bc = hexToRgb(p.barColor || '#99CCFF');
    var hc = hexToRgb(p.barHighColor || '#EE5500');
    for (var i = 0; i < barCount; i++) {
      var t = i / (barCount - 1);
      var h = innerH * (0.3 + 0.6 * Math.sin(t * Math.PI) * (0.5 + 0.5 * Math.sin(i * 1.7)));
      var bx = p.x + pad + i * (barW + gap);
      var by = p.y + pad + innerH - h;
      var ratio = h / innerH;
      var cr = Math.round(bc.r + (hc.r - bc.r) * ratio);
      var cg = Math.round(bc.g + (hc.g - bc.g) * ratio);
      var cb = Math.round(bc.b + (hc.b - bc.b) * ratio);
      ctx.fillStyle = rgbToHex(cr, cg, cb);
      ctx.fillRect(bx, by, barW, h);
    }
    ctx.restore();
  };

  ELEMENT_RENDERERS['progress-bar'] = function (ctx, p) {
    var r = p.h / 2;
    var rl = p.capLeft === 'round' ? r : 0;
    var rr = p.capRight === 'round' ? r : 0;
    ctx.fillStyle = p.bgColor;
    roundedRectPath(ctx, p.x, p.y, p.w, p.h, { tl: rl, bl: rl, tr: rr, br: rr });
    ctx.fill();
    var fw = p.w * Math.max(0, Math.min(100, num(p.fillPercent, 0))) / 100;
    if (fw > 0) {
      ctx.fillStyle = p.fillColor;
      var fillRr = fw >= p.w ? rr : 0;
      roundedRectPath(ctx, p.x, p.y, fw, p.h, { tl: rl, bl: rl, tr: fillRr, br: fillRr });
      ctx.fill();
    }
  };

  ELEMENT_RENDERERS['status-dot'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    if (p.shape === 'circle') {
      var r = Math.min(p.w, p.h) / 2;
      ctx.beginPath();
      ctx.arc(p.x + p.w / 2, p.y + p.h / 2, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x, p.y, p.w, p.h);
    }
  };

  ELEMENT_RENDERERS['status-row'] = function (ctx, p) {
    var colors = p.colors || [];
    var n = colors.length;
    if (n === 0) return;
    var size = p.h;
    for (var i = 0; i < n; i++) {
      ctx.fillStyle = colors[i];
      var sx = p.x + i * (size + (p.gap || 0));
      if (p.shape === 'circle') {
        var r = size / 2;
        ctx.beginPath();
        ctx.arc(sx + r, p.y + r, r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(sx, p.y, size, size);
      }
    }
  };

  ELEMENT_RENDERERS['filled-rect'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    if (p.radius > 0) { roundedRectPath(ctx, p.x, p.y, p.w, p.h, p.radius); ctx.fill(); }
    else { ctx.fillRect(p.x, p.y, p.w, p.h); }
  };

  ELEMENT_RENDERERS['outline-rect'] = function (ctx, p) {
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.lineWidth;
    if (p.radius > 0) {
      roundedRectPath(ctx, p.x + p.lineWidth / 2, p.y + p.lineWidth / 2, p.w - p.lineWidth, p.h - p.lineWidth, p.radius);
      ctx.stroke();
    } else {
      ctx.strokeRect(p.x + p.lineWidth / 2, p.y + p.lineWidth / 2, p.w - p.lineWidth, p.h - p.lineWidth);
    }
  };

  ELEMENT_RENDERERS['sweep-arc'] = function (ctx, p) {
    var cx = p.x + p.w / 2;
    var cy = p.y + p.h / 2;
    var outerR = Math.min(p.w, p.h) / 2;
    var innerR = outerR - (p.thickness || 10);
    var sa = ((p.startAngle || 0) - 90) * Math.PI / 180;
    var ea = ((p.endAngle || 90) - 90) * Math.PI / 180;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, sa, ea);
    ctx.arc(cx, cy, Math.max(0, innerR), ea, sa, true);
    ctx.closePath();
    ctx.fill();
  };

  ELEMENT_RENDERERS['bracket-frame'] = function (ctx, p) {
    var oR = p.elbowR;
    var iR = p.innerR || 0;
    var cW = Math.max(oR, p.barW + iR);
    var cH = Math.max(oR, p.barH + iR);
    var showBottom = p.showBottom !== false;
    drawElbow(ctx, p.x, p.y, cW, cH, p.color, 'tl', p.barW, p.barH, oR, iR);
    ctx.fillStyle = p.color;

<script>
var panelTopBody = document.getElementById('panel-top-body');
var panelBottomBody = document.getElementById('panel-bottom-body');
var currentBottomModule = null;  /* 'audio' | 'memory' | null */

function field(label, id, value, type) {
  return '<div class="field"><label>' + label + '</label><input id="' + id +
         '" type="' + (type || 'text') + '" value="' + (value || '') + '"></div>';
}

function loadConfig() {
  return fetch('/api/config').then(function (r) { return r.json(); });
}

/* ---- UPPER CONTAINER: render MODEL SETUP form (no SAVE button) ---- */
function renderTop() {
  return loadConfig().then(function (cfg) {
    var m = cfg.model || {};
    panelTopBody.innerHTML =
      '<div style="display:flex; flex-direction:row; gap:10px;">' +
        '<div style="flex:2;">' +
          field('MODEL', 'f-model', m.model) +
          field('BASE URL', 'f-url', m.base_url) +
        '</div>' +
        '<div style="flex:3;">' +
          field('API KEY', 'f-key', m.api_key) +
        '</div>' +
      '</div>';
  });
}

/* ---- Save model settings currently shown in upper container ---- */
function saveTop() {
  var fModel = document.getElementById('f-model');
  var fKey = document.getElementById('f-key');
  var fUrl = document.getElementById('f-url');
  return fetch('/api/config/model', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: fModel ? fModel.value.trim() : '',
      api_key: fKey ? fKey.value.trim() : '',
      base_url: fUrl ? fUrl.value.trim() : ''
    })
  }).then(function (r) { return r.json(); });
}

/* ---- LOWER CONTAINER: render AUDIO / MEMORY form (no SAVE button) ---- */
function renderBottom(module) {
  return loadConfig().then(function (cfg) {
    var a = cfg.audio || {};
    var m = cfg.memory || {};
    var html = '';
    if (module === 'audio') {
      html = '<div class="module-title">AUDIO</div>' +
        field('SILENCE_THRESHOLD', 'a-threshold', a.silence_threshold) +
        field('SILENCE_SEC', 'a-silence', a.silence_sec) +
        field('MAX_RECORD_SEC', 'a-max', a.max_record_sec) +
        field('MIN_RECORD_SEC', 'a-min', a.min_record_sec);
    } else if (module === 'memory') {
      html = '<div class="module-title">MEMORY</div>' +
        field('RECENT_KEEP', 'm-recent', m.recent_keep) +
        field('SUMMARY_TRIGGER', 'm-summary', m.summary_trigger) +
        field('RETRIEVE_TOP', 'm-retrieve', m.retrieve_top);
    }
    panelBottomBody.innerHTML = html;
  });
}

/* ---- Save audio or memory settings currently shown in lower container ---- */
function saveBottom(module) {
  if (module === 'audio') {
    return fetch('/api/config/audio', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        silence_threshold: document.getElementById('a-threshold').value,
        silence_sec: document.getElementById('a-silence').value,
        max_record_sec: document.getElementById('a-max').value,
        min_record_sec: document.getElementById('a-min').value
      })
    }).then(function (r) { return r.json(); });
  } else if (module === 'memory') {
    return fetch('/api/config/memory', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recent_keep: document.getElementById('m-recent').value,
        summary_trigger: document.getElementById('m-summary').value,
        retrieve_top: document.getElementById('m-retrieve').value
      })
    }).then(function (r) { return r.json(); });
  }
  return Promise.resolve();
}

/* ---- Panel toggle helpers ---- */
function showPanel(which) {
  var top = document.getElementById('panel-top');
  var bottom = document.getElementById('panel-bottom');
  if (which === 'top') { top.style.display = 'block'; bottom.style.display = 'none'; }
  else if (which === 'bottom') { bottom.style.display = 'block'; top.style.display = 'none'; }
  else if (which === 'none') { top.style.display = 'none'; bottom.style.display = 'none'; }
}
function panelVisible(which) {
  var el = document.getElementById(which === 'top' ? 'panel-top' : 'panel-bottom');
  if (!el) return false;
  var display = el.style.display;
  if (!display) display = window.getComputedStyle(el).display;
  return display !== 'none';
}

/* ============================================================
   SETUP BUTTON TOGGLE:
   - Click 1:  Show upper container with model fields (load latest)
   - Click 2:  Save model config + hide (upper container goes black)
   ============================================================ */
document.getElementById('btn-setup').addEventListener('click', function () {
  if (panelVisible('top')) {
    saveTop().finally(function () { showPanel('none'); });
  } else {
    renderTop().then(function () { showPanel('top'); });
  }
});

/* CHAT button: navigate to chat page */
document.getElementById('btn-chat').addEventListener('click', function () {
  window.location.href = '/chat';
});

/* ============================================================
   AUDIO BUTTON TOGGLE:
   - Click 1:  Show lower container with audio fields
   - Click 2:  Save audio config + hide (lower container goes black)
   ============================================================ */
document.getElementById('btn-audio').addEventListener('click', function () {
  if (panelVisible('bottom') && currentBottomModule === 'audio') {
    saveBottom('audio').finally(function () {
      currentBottomModule = null;
      showPanel('none');
    });
  } else {
    currentBottomModule = 'audio';
    renderBottom('audio').then(function () { showPanel('bottom'); });
  }
});

document.getElementById('btn-memory').addEventListener('click', function () {

      currentBottomModule = null;
      showPanel('none');
    });
  } else {

    renderBottom('memory').then(function () { showPanel('bottom'); });
  }
});
