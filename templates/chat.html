<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Trek Computer - Chat</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ui-layer { position: fixed; inset: 0; pointer-events: none; }
  #ui-layer > * { pointer-events: auto; }

  /* Left: 7 chat buttons (transparent overlay; canvas renders the colored rectangles) */
  .chat-btn {
    position: absolute; left: 2.5%; width: 23.75%; height: 8.33%;
    background: transparent; border: none; cursor: pointer;
    color: #000; font-size: 13px; font-weight: bold; text-align: right;
    padding-right: 10px; box-sizing: border-box;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-btn:hover { filter: brightness(1.2); }
  .chat-btn.active { outline: 2px solid #fff; }
  .chat-btn.empty { cursor: default; }

  /* ============== UPPER / LOWER UI AREA CONTAINERS ============== */
  /* Upper container (messages): right side, above the input bar */
  #chat-messages {
    position: absolute; left: 27.5%; top: 20%; width: 72.5%; height: 55%;
    overflow-y: auto; box-sizing: border-box; padding: 14px 18px;
  }
  #chat-messages::-webkit-scrollbar { width: 6px; }
  #chat-messages::-webkit-scrollbar-thumb { background: #FF9900; border-radius: 3px; }
  .msg { margin-bottom: 10px; max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; word-break: break-word; }
  .msg.user { background: #FF9900; color: #000; margin-left: auto; text-align: right; }
  .msg.ai { background: #1a1a1a; color: #fff; border: 1px solid #FF9900; }
  .msg.log { background: transparent; color: #888; font-size: 12px; margin-left: 0; padding: 2px 4px; }
  .msg.log::before { content: '> '; color: #FF9900; }
  .msg.error { background: #3a0a0a; color: #ff6666; border: 1px solid #ff4444; }

  /* Lower container (input): right side, below the messages area */
  #chat-input { position: absolute; left: 27.5%; top: 75%; width: 72.5%; height: 8.5%; box-sizing: border-box; padding: 6px 12px; display: flex; align-items: center; gap: 8px; }
  #msg-input {
    flex: 1; height: 100%; box-sizing: border-box; background: #111; color: #fff;
    border: 1px solid #FF9900; border-radius: 6px; padding: 0 12px; font-size: 14px;
  }
  #btn-send {
    height: 100%; padding: 0 22px; background: #FF9900; color: #000; border: none;
    border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer;
  }
  #btn-send:hover { background: #FFCC66; }
  #btn-send:disabled { background: #555; cursor: not-allowed; }

  /* ---- Top YELLOW elbow (new chat button overlay) ---- */
  /* Coordinates on 800x480 canvas: x=20, y=0, w=280, h=50  =>  percentages of screen */
  #btn-new-chat {
    position: absolute; left: 2.5%; top: 0%; width: 35%; height: 10.42%;
    background: transparent; border: none; cursor: pointer;
  }
  #btn-new-chat:hover { filter: brightness(1.2); }

  /* ---- Bottom PURPLE elbow (SETUP / back to settings)  ---- */
  /* Canvas elbow: x=20 y=370 w=280 h=50  =>  percentages: 2.5%, 77.08%, 35%, 10.42%
     Keep fully transparent — NO text label on top of the elbow; the purple
     elbow graphic itself is the visual cue. */
  #btn-setup {
    position: absolute; left: 2.5%; top: 77.08%; width: 35%; height: 10.42%;
    background: transparent; border: none; cursor: pointer;
    color: transparent; font-size: 0; line-height: 0;
    padding: 0; box-sizing: border-box; text-indent: -9999px; overflow: hidden;
  }
  #btn-setup:hover { filter: brightness(1.2); }

  /* ============== CONFIRM / CANCEL DIALOG (for dangerous tool calls) ============== */
  #confirm-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: none; align-items: center; justify-content: center; z-index: 9999;
    pointer-events: auto;
  }
  #confirm-mask.visible { display: flex; }
  #confirm-dialog {
    min-width: 340px; max-width: 60vw; box-sizing: border-box;
    background: #0a0a0a; color: #fff;
    border: 2px solid #CC4444; border-radius: 10px; padding: 18px 20px;
    box-shadow: 0 0 30px rgba(204,68,68,0.5);
    font-family: Arial, sans-serif;
  }
  #confirm-dialog .d-title {
    color: #FF5555; font-size: 15px; font-weight: bold; letter-spacing: 1px;
    margin-bottom: 10px; text-transform: uppercase;
  }
  #confirm-dialog .d-hint {
    color: #FFCC66; font-size: 13px; margin-bottom: 10px;
  }
  #confirm-dialog .d-desc {
    background: #111; border: 1px solid #444; border-radius: 6px;
    padding: 10px 12px; font-family: 'Courier New', monospace;
    font-size: 12px; white-space: pre-wrap; word-break: break-all;
    color: #eee; margin-bottom: 18px; max-height: 40vh; overflow-y: auto;
  }
  #confirm-dialog .d-actions { display: flex; justify-content: flex-end; gap: 12px; }
  .confirm-btn {
    padding: 8px 22px; border: none; border-radius: 6px;
    font-weight: bold; font-size: 14px; cursor: pointer; letter-spacing: 1px;
  }
  .confirm-btn.cancel-btn { background: #555; color: #fff; }
  .confirm-btn.cancel-btn:hover { background: #777; }
  .confirm-btn.confirm-btn-ok { background: #CC4444; color: #fff; }
  .confirm-btn.confirm-btn-ok:hover { background: #FF5555; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="ui-layer">
  <!-- TOP: YELLOW elbow area -> click to create NEW CHAT -->
  <button id="btn-new-chat" title="New Chat"></button>

  <!-- Middle left: 7 chat buttons (colored rectangles on canvas) -->
  <div id="chat-btns"></div>

  <!-- UPPER CONTAINER: chat messages display -->
  <div id="chat-messages"></div>

  <!-- LOWER CONTAINER: message input + SEND button -->
  <div id="chat-input">
    <input id="msg-input" placeholder="Type a message, Enter to send...">
    <button id="btn-send">SEND</button>
  </div>

  <!-- BOTTOM: PURPLE elbow area -> click to return to SETUP (no text label) -->
  <button id="btn-setup"></button>
</div>

<!-- CONFIRM / CANCEL DIALOG — appears when the agent needs a human OK
     before running a dangerous tool (e.g. Bash rm / find -delete). -->
<div id="confirm-mask" role="dialog" aria-modal="true" aria-label="Confirm tool execution">
  <div id="confirm-dialog">
    <div class="d-title" id="c-title">PERMISSION REQUIRED</div>
    <div class="d-hint" id="c-hint">The assistant wants to run the following command. Review before approving.</div>
    <div class="d-desc" id="c-desc">-</div>
    <div class="d-actions">
      <button type="button" class="confirm-btn cancel-btn" id="c-btn-cancel">CANCEL</button>
      <button type="button" class="confirm-btn confirm-btn-ok" id="c-btn-confirm">CONFIRM</button>
    </div>
  </div>
</div>

<script type="text/plain" id="renderer-engine">


(function (global) {
  'use strict';

  function num(v, d) { return v != null ? v : d; }

  function roundedRectPath(ctx, x, y, w, h, radii) {
    var r = typeof radii === 'number'
      ? { tl: radii, tr: radii, br: radii, bl: radii }
      : { tl: 0, tr: 0, br: 0, bl: 0 };
    if (radii && typeof radii === 'object') {
      if (radii.tl != null) r.tl = radii.tl;
      if (radii.tr != null) r.tr = radii.tr;
      if (radii.br != null) r.br = radii.br;
      if (radii.bl != null) r.bl = radii.bl;
    }
    ctx.beginPath();
    ctx.moveTo(x + r.tl, y);
    ctx.lineTo(x + w - r.tr, y);
    if (r.tr) ctx.arcTo(x + w, y, x + w, y + r.tr, r.tr);
    else ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + h - r.br);
    if (r.br) ctx.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
    else ctx.lineTo(x + w, y + h);
    ctx.lineTo(x + r.bl, y + h);
    if (r.bl) ctx.arcTo(x, y + h, x, y + h - r.bl, r.bl);
    else ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + r.tl);
    if (r.tl) ctx.arcTo(x, y, x + r.tl, y, r.tl);
    else ctx.lineTo(x, y);
    ctx.closePath();
  }

  function drawElbow(ctx, x, y, w, h, color, corner, barW, barH, outerR, innerR) {
    ctx.fillStyle = color;
    var oR = outerR != null ? Math.max(0, Math.min(outerR, w, h)) : Math.min(barH, barW, w, h);
    var iR = innerR != null ? Math.max(0, Math.min(innerR, w - barW, h - barH)) : 0;
    var ov = 0.5;
    ctx.beginPath();
    switch (corner) {
      case 'tl':
        ctx.moveTo(x, y + h + ov);
        ctx.lineTo(x, y + oR);
        ctx.arcTo(x, y, x + oR, y, oR);
        ctx.lineTo(x + w + ov, y);
        ctx.lineTo(x + w + ov, y + barH);
        if (iR > 0) {
          ctx.lineTo(x + barW + iR, y + barH);
          ctx.arcTo(x + barW, y + barH, x + barW, y + barH + iR, iR);
        } else {
          ctx.lineTo(x + barW, y + barH);
        }
        ctx.lineTo(x + barW, y + h + ov);
        break;
      case 'tr':
        ctx.moveTo(x - ov, y);
        ctx.lineTo(x + w - oR, y);
        ctx.arcTo(x + w, y, x + w, y + oR, oR);
        ctx.lineTo(x + w, y + h + ov);
        ctx.lineTo(x + w - barW, y + h + ov);
        if (iR > 0) {
          ctx.lineTo(x + w - barW, y + barH + iR);
          ctx.arcTo(x + w - barW, y + barH, x + w - barW - iR, y + barH, iR);
        } else {
          ctx.lineTo(x + w - barW, y + barH);
        }
        ctx.lineTo(x - ov, y + barH);
        break;
      case 'bl':
        ctx.moveTo(x, y - ov);
        ctx.lineTo(x + barW, y - ov);
        if (iR > 0) {
          ctx.lineTo(x + barW, y + h - barH - iR);
          ctx.arcTo(x + barW, y + h - barH, x + barW + iR, y + h - barH, iR);
        } else {
          ctx.lineTo(x + barW, y + h - barH);
        }
        ctx.lineTo(x + w + ov, y + h - barH);
        ctx.lineTo(x + w + ov, y + h);
        ctx.lineTo(x + oR, y + h);
        ctx.arcTo(x, y + h, x, y + h - oR, oR);
        break;
      case 'br':
        ctx.moveTo(x + w, y - ov);
        ctx.lineTo(x + w, y + h - oR);
        ctx.arcTo(x + w, y + h, x + w - oR, y + h, oR);
        ctx.lineTo(x - ov, y + h);
        ctx.lineTo(x - ov, y + h - barH);
        if (iR > 0) {
          ctx.lineTo(x + w - barW - iR, y + h - barH);
          ctx.arcTo(x + w - barW, y + h - barH, x + w - barW, y + h - barH - iR, iR);
        } else {
          ctx.lineTo(x + w - barW, y + h - barH);
        }
        ctx.lineTo(x + w - barW, y - ov);
        break;
    }
    ctx.closePath();
    ctx.fill();
  }

  function hexToRgb(hex) {
    return {
      r: parseInt(hex.slice(1, 3), 16),
      g: parseInt(hex.slice(3, 5), 16),
      b: parseInt(hex.slice(5, 7), 16)
    };
  }

  function rgbToHex(r, g, b) {
    var to2 = function (v) { return v.toString(16).padStart(2, '0'); };
    return '#' + to2(r) + to2(g) + to2(b);
  }

  /* ---------------- Element renderers ---------------- */
  var ELEMENT_RENDERERS = {};

  ELEMENT_RENDERERS['elbow-tl'] = function (ctx, p) {
    var gap = p.bottomGap || 0;
    drawElbow(ctx, p.x, p.y, p.w, p.h - gap, p.color, 'tl', p.barW, p.barH, p.outerR, p.innerR);
    if (p.label) {
      ctx.fillStyle = p.labelColor;
      ctx.font = 'bold ' + p.labelFontSize + 'px Antonio, Arial, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x + p.w - 6, p.y + p.barH / 2 + 1);
    }
  };

  ELEMENT_RENDERERS['elbow-tr'] = function (ctx, p) {
    var gap = p.bottomGap || 0;
    drawElbow(ctx, p.x, p.y, p.w, p.h - gap, p.color, 'tr', p.barW, p.barH, p.outerR, p.innerR);
    if (p.label) {
      ctx.fillStyle = p.labelColor;
      ctx.font = 'bold ' + p.labelFontSize + 'px Antonio, Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x + 6, p.y + p.barH / 2 + 1);
    }
  };

  ELEMENT_RENDERERS['elbow-bl'] = function (ctx, p) {
    var gap = p.topGap || 0;
    drawElbow(ctx, p.x, p.y + gap, p.w, p.h - gap, p.color, 'bl', p.barW, p.barH, p.outerR, p.innerR);
    if (p.label) {
      ctx.fillStyle = p.labelColor;
      ctx.font = 'bold ' + p.labelFontSize + 'px Antonio, Arial, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x + p.w - 6, p.y + p.h - p.barH / 2 + 1);
    }
  };

  ELEMENT_RENDERERS['elbow-br'] = function (ctx, p) {
    var gap = p.topGap || 0;
    drawElbow(ctx, p.x, p.y + gap, p.w, p.h - gap, p.color, 'br', p.barW, p.barH, p.outerR, p.innerR);
    if (p.label) {
      ctx.fillStyle = p.labelColor;
      ctx.font = 'bold ' + p.labelFontSize + 'px Antonio, Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x + 6, p.y + p.h - p.barH / 2 + 1);
    }
  };

  ELEMENT_RENDERERS['bar-horizontal'] = function (ctx, p) {
    var t = p.topGap || 0, b = p.bottomGap || 0, l = p.leftGap || 0, r = p.rightGap || 0;
    var bx = p.x + l, by = p.y + t;
    var bw = p.w - l - r, bh = p.h - t - b;
    if (bw <= 0 || bh <= 0) return;
    ctx.fillStyle = p.color;
    var hr = bh / 2;
    var rl = p.endCapLeft === 'round' ? hr : 0;
    var rr = p.endCapRight === 'round' ? hr : 0;
    var ovL = rl === 0 ? 0.5 : 0;
    var ovR = rr === 0 ? 0.5 : 0;
    roundedRectPath(ctx, bx - ovL, by, bw + ovL + ovR, bh, { tl: rl, bl: rl, tr: rr, br: rr });
    ctx.fill();
  };

  ELEMENT_RENDERERS['bar-vertical'] = function (ctx, p) {
    var t = p.topGap || 0, b = p.bottomGap || 0, l = p.leftGap || 0, r = p.rightGap || 0;
    var bx = p.x + l, by = p.y + t;
    var bw = p.w - l - r, bh = p.h - t - b;
    if (bw <= 0 || bh <= 0) return;
    ctx.fillStyle = p.color;
    var hr = bw / 2;
    var rt = p.endCapTop === 'round' ? hr : 0;
    var rb = p.endCapBottom === 'round' ? hr : 0;
    var ovT = rt === 0 ? 0.5 : 0;
    var ovB = rb === 0 ? 0.5 : 0;
    roundedRectPath(ctx, bx, by - ovT, bw, bh + ovT + ovB, { tl: rt, tr: rt, bl: rb, br: rb });
    ctx.fill();
  };

  ELEMENT_RENDERERS['separator'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.w, p.h);
  };

  ELEMENT_RENDERERS['button-pill'] = function (ctx, p) {
    var r = p.h / 2;
    ctx.fillStyle = p.color;
    roundedRectPath(ctx, p.x, p.y, p.w, p.h, r);
    ctx.fill();
    ctx.fillStyle = p.textColor;
    ctx.font = 'bold ' + p.fontSize + 'px Antonio, Arial, sans-serif';
    var tx;
    if (p.textAlign === 'left') { ctx.textAlign = 'left'; tx = p.x + r; }
    else if (p.textAlign === 'center') { ctx.textAlign = 'center'; tx = p.x + p.w / 2; }
    else { ctx.textAlign = 'right'; tx = p.x + p.w - r; }
    ctx.textBaseline = 'middle';
    ctx.fillText(p.label, tx, p.y + p.h / 2 + 1);
  };

  ELEMENT_RENDERERS['button-rect'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    roundedRectPath(ctx, p.x, p.y, p.w, p.h, p.radius);
    ctx.fill();
    ctx.fillStyle = p.textColor;
    ctx.font = 'bold ' + p.fontSize + 'px Antonio, Arial, sans-serif';
    var tx;
    if (p.textAlign === 'left') { ctx.textAlign = 'left'; tx = p.x + 8; }
    else if (p.textAlign === 'center') { ctx.textAlign = 'center'; tx = p.x + p.w / 2; }
    else { ctx.textAlign = 'right'; tx = p.x + p.w - 8; }
    ctx.textBaseline = 'middle';
    ctx.fillText(p.label, tx, p.y + p.h / 2 + 1);
  };

  ELEMENT_RENDERERS['button-strip'] = function (ctx, p) {
    var colors = p.colors || [];
    var n = colors.length;
    if (n === 0) return;
    var totalGap = p.gap * (n - 1);
    var segW = (p.w - totalGap) / n;
    var r = p.h / 2;
    for (var i = 0; i < n; i++) {
      ctx.fillStyle = colors[i];
      var sx = p.x + i * (segW + p.gap);
      var rl = (i === 0 && p.capLeft === 'round') ? r : 0;
      var rr = (i === n - 1 && p.capRight === 'round') ? r : 0;
      roundedRectPath(ctx, sx, p.y, segW, p.h, { tl: rl, bl: rl, tr: rr, br: rr });
      ctx.fill();
    }
  };

  ELEMENT_RENDERERS['text-label'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    ctx.font = num(p.fontWeight, 'bold') + ' ' + p.fontSize + 'px Antonio, Arial, sans-serif';
    ctx.textBaseline = 'top';
    if (p.textAlign === 'center') { ctx.textAlign = 'center'; ctx.fillText(p.text, p.x + p.w / 2, p.y); }
    else if (p.textAlign === 'right') { ctx.textAlign = 'right'; ctx.fillText(p.text, p.x + p.w, p.y); }
    else { ctx.textAlign = 'left'; ctx.fillText(p.text, p.x, p.y); }
  };

  ELEMENT_RENDERERS['data-readout'] = function (ctx, p) {
    if (p.bgColor) { ctx.fillStyle = p.bgColor; roundedRectPath(ctx, p.x, p.y, p.w, p.h, 4); ctx.fill(); }
    if (p.borderColor) { ctx.strokeStyle = p.borderColor; ctx.lineWidth = 1; roundedRectPath(ctx, p.x, p.y, p.w, p.h, 4); ctx.stroke(); }
    ctx.fillStyle = p.labelColor;
    ctx.font = 'bold ' + p.labelFontSize + 'px Antonio, Arial, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(p.label, p.x + 6, p.y + 4);
    ctx.fillStyle = p.valueColor;
    ctx.font = 'bold ' + p.valueFontSize + 'px Antonio, Arial, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(p.value, p.x + 6, p.y + p.h - 3);
  };

  ELEMENT_RENDERERS['clock-display'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    ctx.font = 'bold ' + p.fontSize + 'px Antonio, Arial, sans-serif';
    ctx.textBaseline = 'middle';
    if (p.textAlign === 'center') { ctx.textAlign = 'center'; ctx.fillText(p.timeText, p.x + p.w / 2, p.y + p.h / 2); }
    else if (p.textAlign === 'right') { ctx.textAlign = 'right'; ctx.fillText(p.timeText, p.x + p.w, p.y + p.h / 2); }
    else { ctx.textAlign = 'left'; ctx.fillText(p.timeText, p.x, p.y + p.h / 2); }
  };

  ELEMENT_RENDERERS['date-display'] = function (ctx, p) {
    ctx.fillStyle = p.color;
    ctx.font = 'bold ' + p.fontSize + 'px Antonio, Arial, sans-serif';
    ctx.textBaseline = 'middle';
    if (p.textAlign === 'center') { ctx.textAlign = 'center'; ctx.fillText(p.dateText, p.x + p.w / 2, p.y + p.h / 2); }
    else if (p.textAlign === 'right') { ctx.textAlign = 'right'; ctx.fillText(p.dateText, p.x + p.w, p.y + p.h / 2); }
    else { ctx.textAlign = 'left'; ctx.fillText(p.dateText, p.x, p.y + p.h / 2); }
  };

  ELEMENT_RENDERERS['fft-area'] = function (ctx, p) {
    ctx.fillStyle = p.bgColor;
    roundedRectPath(ctx, p.x, p.y, p.w, p.h, p.borderRadius);
    ctx.fill();
    if (p.showBorder) {
      ctx.strokeStyle = p.borderColor;
      ctx.lineWidth = 1;
      roundedRectPath(ctx, p.x, p.y, p.w, p.h, p.borderRadius);
      ctx.stroke();
    }
    var barCount = num(p.barCount, 16);
    if (barCount < 2) barCount = 2;
    ctx.save();
    ctx.beginPath();
    roundedRectPath(ctx, p.x + 1, p.y + 1, p.w - 2, p.h - 2, Math.max(0, (p.borderRadius || 0) - 1));
    ctx.clip();
    var pad = 4;
    var innerW = p.w - pad * 2;
    var innerH = p.h - pad * 2;
    var gap = p.gap || 0;
    var barW = (innerW - (barCount - 1) * gap) / barCount;
    var bc = hexToRgb(p.barColor || '#99CCFF');
    var hc = hexToRgb(p.barHighColor || '#EE5500');
    for (var i = 0; i < barCount; i++) {
      var t = i / (barCount - 1);
      var h = innerH * (0.3 + 0.6 * Math.sin(t * Math.PI) * (0.5 + 0.5 * Math.sin(i * 1.7)));
      var bx = p.x + pad + i * (barW + gap);
      var by = p.y + pad + innerH - h;
      var ratio = h / innerH;
      var cr = Math.round(bc.r + (hc.r - bc.r) * ratio);
      var cg = Math.round(bc.g + (hc.g - bc.g) * ratio);
      var cb = Math.round(bc.b + (hc.b - bc.b) * ratio);
      ctx.fillStyle = rgbToHex(cr, cg, cb);
      ctx.fillRect(bx, by, barW, h);
    }
    ctx.restore();
  };

  ELEMENT_RENDERERS['progress-bar'] = function (ctx, p) {
    var r = p.h / 2;

<script>
var BTN_TOPS = [11.46, 20.83, 30.21, 39.58, 48.96, 58.33, 67.71];
var chats = [];
var scrollIndex = 0;
var currentChat = null;
var busy = false;
var messagesEl = document.getElementById('chat-messages');
var btnsEl = document.getElementById('chat-btns');

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
function addMsg(type, text) {
  var d = document.createElement('div');
  d.className = 'msg ' + type;
  d.innerHTML = esc(text);
  messagesEl.appendChild(d);
  scrollBottom();
}

/* Render 7 chat button slots (show chat names or empty placeholders) */
function renderButtons() {
  btnsEl.innerHTML = '';
  for (var i = 0; i < 7; i++) {
    var b = document.createElement('button');
    b.className = 'chat-btn';
    b.style.top = BTN_TOPS[i] + '%';
    var name = chats[scrollIndex + i];
    if (name) {
      b.textContent = name;
      b.dataset.name = name;
      if (name === currentChat) b.classList.add('active');
      b.addEventListener('click', (function (n) { return function () { switchChat(n); }; })(name));
    } else {
      b.classList.add('empty');
    }
    btnsEl.appendChild(b);
  }
}

/* Load chat list from the server (newest first) */
function loadChats() {
  return fetch('/api/chats').then(function (r) { return r.json(); }).then(function (res) {
    chats = res.chats || [];
    if (scrollIndex > Math.max(0, chats.length - 7)) scrollIndex = Math.max(0, chats.length - 7);
    renderButtons();
    /* ************************************************************
       FIX: auto-select the first available chat so messages display
       immediately when the page loads (instead of staying blank).
       ************************************************************ */
    if (!currentChat && chats.length > 0) {
      switchChat(chats[0]);
    }
  });
}

/* Switch to a chat and load its message history */
function switchChat(name) {
  currentChat = name;
  messagesEl.innerHTML = '';
  renderButtons();
  fetch('/api/chats/' + encodeURIComponent(name) + '/history')
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res && res.ok && Array.isArray(res.history)) {
        res.history.forEach(function (m) {
          var role = (m.role === 'user' || m.role === 'assistant') ? m.role : 'ai';
          if (role === 'assistant') role = 'ai';
          addMsg(role, m.content || '');
        });
      }
    });
}

/* Virtual scroll through chat list (buttons stay fixed; names shift) */
document.addEventListener('wheel', function (e) {
  if (e.target.closest('#chat-messages')) return;
  if (e.deltaY > 0) {
    if (scrollIndex < Math.max(0, chats.length - 7)) { scrollIndex++; renderButtons(); }
  } else {
    if (scrollIndex > 0) { scrollIndex--; renderButtons(); }
  }
}, { passive: true });

/* Send a message in the current chat */
function send() {
  var input = document.getElementById('msg-input');
  var text = input.value.trim();
  if (!text || busy || !currentChat) return;
  input.value = '';
  addMsg('user', text);
  busy = true;
  document.getElementById('btn-send').disabled = true;
  fetch('/api/chats/' + encodeURIComponent(currentChat) + '/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  }).then(function (r) { return r.json(); }).then(function (res) {
    if (!res.ok) { addMsg('error', res.error || 'Failed to send'); busy = false; document.getElementById('btn-send').disabled = false; }
  });
}
document.getElementById('btn-send').addEventListener('click', send);
document.getElementById('msg-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') send();
});

/* ========== TOP YELLOW ELBOW: create NEW CHAT ========== */
document.getElementById('btn-new-chat').addEventListener('click', function () {
  fetch('/api/chats/new', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' }
  }).then(function (r) { return r.json(); }).then(function (res) {
    if (res && res.ok) {
      // Reload chats and select the newly created one
      loadChats().then(function () {
        if (res.name) {
          currentChat = null;   // force switchChat to re-render
          switchChat(res.name);
          scrollIndex = 0;
          renderButtons();
        }
      });
    }
  });
});

/* ========== BOTTOM PURPLE ELBOW: navigate back to SETUP page ========== */
document.getElementById('btn-setup').addEventListener('click', function () {
  window.location.href = '/setup';
});

/* ========== CONFIRM DIALOG: appears when agent wants human approval ==========
   Shows a modal with CONFIRM / CANCEL buttons. Event flow:
   confirm_prompt(id, chat, desc, message) -> open dialog
   confirm_closed(id, result|timed_out)    -> close dialog
   POST /api/confirm/1 or /api/confirm/0   -> user decision
*/
var activeConfirmId = null;
function openConfirm(id, desc, message) {
  activeConfirmId = id;
  document.getElementById('c-title').textContent = 'PERMISSION REQUIRED';
  document.getElementById('c-hint').textContent = message || 'This tool requires your approval.';
  document.getElementById('c-desc').textContent = desc || '(no description)';
  document.getElementById('confirm-mask').classList.add('visible');
}
function closeConfirm() {
  activeConfirmId = null;
  document.getElementById('confirm-mask').classList.remove('visible');
}
function submitConfirm(approved) {
  if (!activeConfirmId) return;
  var cid = activeConfirmId;
  var url = approved ? '/api/confirm/confirm' : '/api/confirm/cancel';
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: cid })
  }).finally(function () {
    closeConfirm();
  });
}
document.getElementById('c-btn-confirm').addEventListener('click', function () { submitConfirm(true); });
document.getElementById('c-btn-cancel').addEventListener('click', function () { submitConfirm(false); });

/* SSE real-time event stream */
function connectStream() {
  var es = new EventSource('/api/stream');
  es.addEventListener('assistant', function (e) {
    var d = JSON.parse(e.data);
    if (d.chat === currentChat) {
      var last = messagesEl.lastElementChild;
      if (last && last.classList.contains('ai')) {
        last.innerHTML = esc(d.text);
      } else {
        addMsg('ai', d.text);
      }
      scrollBottom();
    }
  });
  es.addEventListener('log', function (e) {
    var d = JSON.parse(e.data);
    if (d.chat === currentChat) addMsg('log', d.text);
  });
  es.addEventListener('done', function () {
    busy = false;
    document.getElementById('btn-send').disabled = false;
    loadChats();
  });
  es.addEventListener('error', function (e) {
    var d = JSON.parse(e.data);
    addMsg('error', d.text || 'Connection error');
    busy = false;
    document.getElementById('btn-send').disabled = false;
  });
  es.addEventListener('confirm_prompt', function (e) {
    var d = JSON.parse(e.data);
    // Show for the current chat; background chats also get the prompt but
    // the user is likely focused on activeChat.
    if (!d.chat || d.chat === currentChat) {
      openConfirm(d.id, d.desc, d.message);
    } else {
      // Queue a log line so the user notices when they switch back
      addMsg('log', 'Permission pending for another chat: ' + (d.desc || ''));
    }
  });
  es.addEventListener('confirm_closed', function (e) {
    var d = JSON.parse(e.data);
    if (activeConfirmId && activeConfirmId === d.id) {
      closeConfirm();
      if (d.timed_out) {
        addMsg('log', 'Confirmation timed out (120s) — operation denied.');
      } else if (d.result) {
        addMsg('log', 'Confirmation accepted.');
      } else {
        addMsg('log', 'Confirmation cancelled.');
      }
    }
  });
  es.onerror = function () { /* auto-reconnect by browser */ };
}

loadChats();
connectStream();
</script>
